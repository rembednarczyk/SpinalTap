name: CI
# A pull request's run carries the base it was tested on, so the push to main after a merge can
# tell whether that exact code already passed (see the "changes" job).
# A workflow_dispatch run (map-refresh.yml starts one on its branch: a PR opened with GITHUB_TOKEN
# starts no workflow) is named after its branch.
run-name: ${{ github.event_name == 'pull_request' && format('{0} (#{1}) on base {2}', github.event.pull_request.title, github.event.pull_request.number, github.event.pull_request.base.sha) || github.event_name == 'workflow_dispatch' && format('Dispatch on {0}', github.ref_name) || github.event_name == 'schedule' && 'Nightly full run' || github.event.head_commit.message }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # By hand or from map-refresh.yml: "What changed" has no base to compare with (no PR, no
  # `before`), so it runs everything; the skip of code already tested is for pushes only.
  workflow_dispatch:
  # ADR-0046 (decision of the user 16.11): a pull request runs what its files reach (job "What
  # changed", tools/ci-scope); main and this nightly run run everything, so what a light pull
  # request left out turns main red by the next morning at the latest.
  schedule:
    - cron: "17 2 * * *"

concurrency:
  # The nightly run has its own group: a push to main would cancel it (and it the push's run).
  # A push to main gets a group of its own commit (user decision 16.11): each merge runs whole,
  # so a red main names the merge that broke it. In one group a newer push would cancel the
  # older run, and with light pull requests most merges would go untested in full.
  # A pull request's newer push still cancels its older run.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && format('main-{0}', github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Minutes (user decision 1.11, no loss of coverage): draft pull requests run nothing (mark the
  # PR ready for CI); a change of docs alone (docs/**, changelog.d/**, *.md) runs nothing either,
  # on a pull request and on main; every job has a time limit, so a hung run cannot burn hours.
  # A light pull request (user decision 16.11, ADR-0046): typecheck, lint and architecture always;
  # the unit tests related to its files by the import graph (`vitest related`), no coverage; e2e
  # only when it touches what a browser draws. Shared files (workflows, package.json, lockfile,
  # tsconfig) run everything. The rules and their tests: tools/ci-scope. A skipped job counts as
  # passed (main has no required checks, and GitHub takes a skipped job as a success), as for docs.
  changes:
    name: What changed
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tables: ${{ steps.diff.outputs.tables }}
      e2e: ${{ steps.diff.outputs.e2e }}
      # full, related (the files in unit_files, a JSON array) or none.
      unit: ${{ steps.diff.outputs.unit }}
      unit_files: ${{ steps.diff.outputs.unit_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node runs the selector's TypeScript directly (tools/ci-scope), no pnpm install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A push to main from a merge whose pull request passed CI on this same base (the main
      # before the push) holds exactly the code that run tested: a squash merge of the PR's head
      # onto that base. It runs nothing again (saves a full run per merge), but only when that run
      # was full (artifact ci-full-run: every unit test and every e2e group); after a light run
      # main runs everything. A merge onto a main that moved since the PR's run (another PR in
      # between) runs everything, as before.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          if [ -z "$head" ] || [ -z "$BEFORE" ]; then echo "same=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=50" \
            --jq ".workflow_runs[] | select(.display_title | endswith(\"on base $BEFORE\")) | .id" || true)
          runs=0
          for id in $ids; do
            full=$(gh api "repos/$REPO/actions/runs/$id/artifacts?name=ci-full-run" --jq '.total_count' || echo 0)
            if [ "${full:-0}" -gt 0 ]; then runs=$((runs + 1)); fi
          done
          echo "PR head $head, base $BEFORE: $runs green full run(s) on this base, of $(echo $ids | wc -w) green run(s)"
          if [ "${runs:-0}" -gt 0 ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      # Docs alone: nothing; a pull request: its scope (tools/ci-scope/src/scope.ts); a push to
      # main: everything; the nightly run and a run by hand (no base to compare with): everything.
      - id: diff
        run: |
          if [ "${{ steps.tested.outputs.same }}" = "true" ]; then
            echo "The merged code passed a full CI run in its pull request on this base: nothing runs again."
            printf 'code=false\ntables=false\ne2e=false\nunit=none\nunit_files=[]\nfull=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed"
            mode=""
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            git -c core.quotePath=false diff --name-only "${{ github.event.before }}" HEAD > "$RUNNER_TEMP/changed"
            mode="--push"
          else
            node tools/ci-scope/src/cli.ts --full "${{ github.event_name }}: no base to compare with, everything"; exit 0
          fi
          cat "$RUNNER_TEMP/changed"
          node tools/ci-scope/src/cli.ts $mode < "$RUNNER_TEMP/changed"
      - name: Mark a full run (a later push of the same code to main runs nothing again)
        if: steps.diff.outputs.full == 'true'
        run: echo "${{ github.event_name }} ${{ github.sha }}" > "$RUNNER_TEMP/ci-full-run.txt"
      - if: steps.diff.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-run
          path: ${{ runner.temp }}/ci-full-run.txt
          retention-days: 30

  # ADR-0083: the one check that the committed map tables are what their inputs give. It generates
  # them again and compares byte for byte, and checks that every file the generators read is an
  # input in table-inputs.ts and that a change of it runs this job (tools/ci-scope). The tables carry
  # no fingerprint of their inputs (decision of 16.11: the header line conflicted in 27 of 30 merges).
  tables:
    name: Map tables
    needs: changes
    # Every change of code: the generators import much of the simulation and the renderer, so a change
    # there can shape the tables too.
    if: needs.changes.outputs.tables == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the tables (pnpm osm:build && pnpm osm:props), recording the files they read
        run: |
          READ_TRACE="$RUNNER_TEMP/build.txt" node --import ./tools/osm-import/src/read-trace.ts tools/osm-import/src/build.ts > "$RUNNER_TEMP/build.log"
          READ_TRACE="$RUNNER_TEMP/props.txt" node --import ./tools/osm-import/src/read-trace.ts tools/osm-import/src/props.ts > "$RUNNER_TEMP/props.log"
      - name: Compare with the committed tables
        run: |
          if ! git diff --quiet -- packages/sim/src/content/lublin; then
            git diff --stat -- packages/sim/src/content/lublin
            git diff -- packages/sim/src/content/lublin | cut -c1-200 | head -80
            echo "::error title=Map tables out of date::The committed tables differ from what pnpm osm:build && pnpm osm:props write from the inputs: run both and commit packages/sim/src/content/lublin/*.generated.ts (ADR-0083)."
            exit 1
          fi
      - name: Check that the inputs cover every file the generators read, and that each runs this job
        run: |
          node tools/osm-import/src/tables-check.ts --trace "build=$RUNNER_TEMP/build.txt" --trace "props=$RUNNER_TEMP/props.txt" || {
            echo "::error title=Map tables' inputs::A file the generators read is no input in tools/osm-import/src/table-inputs.ts, or a change of it would not run this job (tools/ci-scope; ADR-0083; the log above lists it)."
            exit 1
          }

  # G-376: one job ran the whole suite with coverage in 18.6 min against its 20 min limit. The
  # shards run in parallel and write blob reports; the checks job merges them and applies the
  # coverage thresholds once, on the merged coverage (a shard alone covers only part of the code).
  # A light pull request (ADR-0046) runs `vitest related` on its files, in the same shards and
  # without coverage; a shard Vitest gives no file passes (`--passWithNoTests`). No file with a
  # unit test (an e2e spec alone): no job.
  # Three since 20.11: two shards took 12.0-17.4 and 11.5-19.2 min of the 20 on seven green runs
  # of main, and #804 (a full run) had shard 1 cancelled at 20 min with 456 of its about 460
  # files done, each 1.6 times slower than on main (a slow runner).
  # Vitest splits by a hash of the path, not by time: the times of five of those runs split the
  # same way give the heaviest shard 27-35 min of file time against 37-50 with two (about 10-13
  # min of wall time against 14-19), and a fourth shard only 21-28 (the hash keeps the heaviest
  # files together). `strategy.job-total` gives Vitest the number of shards; job checks merges
  # every blob-*, and the time gate reads every unit-times-* of a run, from two shards or three
  # (tools/test-time/src/artifacts.ts).
  unit:
    # No matrix value in the name, as with the e2e shards.
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.unit != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 20.11: two shards of #804 and #806 ran every file 1.6 times slower than main's median, from
      # the first minute to the last and as slow with one file running as with three, so the
      # runner's cores, not the order of the files or the workers (main's shards: 0.65-1.25). The
      # log says nothing of the machine: the CPU and its count beside the shard's time tell the
      # next slow runner from a slower test.
      - name: Runner's CPU
        run: |
          line="Unit shard ${{ matrix.shard }}: $(nproc) CPU, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
      # The default reporter prints failures in the log; the blob report feeds the merge; the
      # test-time reporter writes the time of every file for the time gate (job test-time); the
      # github-actions reporter puts each failure (test, message, file:line) as a short annotation
      # on the check run, so a red run is read without downloading the whole log.
      - name: Unit tests (every test with coverage, or on a pull request the ones related to its files)
        env:
          VITEST_COVERAGE_SHARD: "1"
          TEST_TIME_OUTPUT: reports/unit-times/unit-times-${{ matrix.shard }}.json
          UNIT: ${{ needs.changes.outputs.unit }}
          UNIT_FILES: ${{ needs.changes.outputs.unit_files }}
        run: |
          reporters=(--reporter=default --reporter=blob --reporter=github-actions --reporter=./tools/test-time/src/reporter.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }})
          if [ "$UNIT" = "full" ]; then
            pnpm exec vitest run --coverage "${reporters[@]}"
            exit
          fi
          mapfile -t files < <(node -e 'for (const f of JSON.parse(process.env.UNIT_FILES)) console.log(f)')
          line="Pull request: unit tests related to ${#files[@]} changed or read file(s), no coverage (ADR-0046, job What changed lists them); main and the nightly run run every test."
          echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec vitest related --run --passWithNoTests "${reporters[@]}" "${files[@]}"
      # Only a passing shard: a red run is no reference. On main the times are the reference for
      # the pull requests that follow, so they stay longer than the copy of a pull request.
      - uses: actions/upload-artifact@v4
        with:
          name: unit-times-${{ matrix.shard }}
          path: reports/unit-times
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
      # The blob reports feed only the coverage of a full run (job checks).
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.unit == 'full'
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  # Typecheck, lint and architecture on every change of code, also when no unit test runs (job unit
  # skipped) or a shard failed; the merge of the shards with the coverage thresholds only in a full run.
  checks:
    name: Typecheck, lint, architecture, unit tests
    needs: [changes, unit]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm depcheck
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.unit == 'full'
        with:
          pattern: blob-*
          path: .vitest/blob
          merge-multiple: true
      - if: needs.changes.outputs.unit == 'full'
        run: pnpm exec vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.unit == 'full'
        with:
          name: coverage
          path: reports/coverage

  # Time gate of the unit tests (ADR-0046, ADR-0083 step 2): a test over half of its time limit,
  # or more than 30% (and 1 s) slower than the median of the last green runs of main, fails the
  # pull request that slows it (exceptions only by tools/test-time/src/exceptions.ts, with their
  # reasons); a test file more than 50% and 2 s slower than the last run of main gets a warning.
  # Its own small job after the shards, beside the checks, so it adds nothing to the critical path:
  # no pnpm install, Node runs the tool's TypeScript directly.
  # A light pull request compares only the tests it ran (gate.ts takes the tests of the head, the sum
  # of main is over the same files); the reference is only green push runs of main, which are full.
  test-time:
    name: Unit test time
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.unit != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/test-time
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-times-*
          path: ${{ runner.temp }}/times/head
          merge-multiple: true
      # The newest green push runs of main that have the times (a docs-only run has none), up to
      # five (REFERENCE_RUNS in tools/test-time/src/gate.ts), each in its own directory, newest
      # first: the gate takes the median over them. Reading artifacts of other runs needs only the
      # run's own token with actions: read.
      - name: Download the times of the last green runs of main
        id: main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/times/main"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 30 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha[0:7])"' > "$RUNNER_TEMP/main-runs"
          n=0
          while read -r id sha; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'unit-times-*' --dir "$RUNNER_TEMP/times/main/$((n + 1))" < /dev/null; then
              n=$((n + 1))
              [ "$n" = 1 ] && echo "reference=main $sha, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >> "$GITHUB_OUTPUT"
              [ "$n" = 5 ] && break
            else
              rm -rf "$RUNNER_TEMP/times/main/$((n + 1))"
            fi
          done < "$RUNNER_TEMP/main-runs"
          echo "$n green run(s) of main with unit test times among the last 30."
      - name: Compare with main
        env:
          REFERENCE: ${{ steps.main.outputs.reference }}
        run: node tools/test-time/src/compare.ts "$RUNNER_TEMP/times/head" "$RUNNER_TEMP/times/main" "$REFERENCE"

  # ADR-0046: shards in parallel with the checks; each builds once and runs a group of specs
  # (a single job took 40 min, most of it cold boots under SwiftShader). Setup is about 2 min a
  # shard with warm caches (G-387). Three since 15.11: two groups reached 24.7 and 14.7 min of
  # the 25 min limit (playwright.config.ts). On 17.11 group 3 took up to 24.5 min on a slow
  # runner and ui-scale moved to group 2 (expected at most about 19 min each).
  e2e:
    # No matrix value in the name: GitHub appends "(1)", "(2)" itself, and a skipped job (docs-only
    # change) then reads plainly instead of showing the unexpanded expression.
    name: E2E (build, smoke, NPR snapshot, perf budget)
    needs: changes
    # A pull request only when it touches what a browser draws (tools/ci-scope: engine, app, ui,
    # e2e, Playwright, models, map tables, shared files); main and the nightly run always.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start the clock
        run: echo "start $(date +%s)" > "$RUNNER_TEMP/e2e-times"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # G-387: browsers and the system packages Playwright wants come from caches. The fonts
      # (fonts-ipafont-gothic, fonts-unifont, xfonts-*, 22 MB) once took 11 min from a slow apt
      # mirror and the shard ran out of time. They stay installed: signs and props draw text into
      # the canvas, so the NPR snapshot may depend on the fallback fonts.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install chromium
      - name: Install system dependencies of Chromium (cached .deb packages first)
        id: deps
        run: |
          # The dry run lists what apt would install (dependencies included) and exits 1 if any.
          missing() { pnpm exec playwright install-deps --dry-run chromium | sed -n 's/^  \([^ ]*\)$/\1/p' || true; }
          need=$(missing)
          if [ -z "$need" ]; then echo "All system dependencies of Chromium are installed."; exit 0; fi
          echo "Missing:" $need
          if ls ~/playwright-debs/*.deb >/dev/null 2>&1; then
            # Local .deb files whose dependencies are present: dpkg only, no apt resolution and no mirror.
            # apt-get install with file paths still fetched the same fonts from the mirror when the
            # mirror offered another candidate (amd64v3), which cost 15 min at 31 kB/s (G-400).
            ls -l ~/playwright-debs
            sudo dpkg -i ~/playwright-debs/*.deb || true
            need=$(missing)
          fi
          if [ -n "$need" ]; then
            echo "Downloading:" $need
            sudo apt-get update
            mkdir -p ~/playwright-debs
            (cd ~/playwright-debs && apt-get download $need)
            sudo dpkg -i ~/playwright-debs/*.deb
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          test -z "$(missing)"
      - if: steps.deps.outputs.save == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Mark the end of setup
        run: echo "setup $(date +%s)" >> "$RUNNER_TEMP/e2e-times"
      # Three groups of about equal time (playwright.config.ts, E2E_GROUP), not --shard: that splits
      # by test count and left every slow spec in shard 1.
      - run: pnpm test:e2e
        env:
          CI: "true"
          E2E_GROUP: ${{ matrix.shard }}
      - name: Print setup and test times
        if: always()
        run: |
          now=$(date +%s)
          start=$(awk '$1 == "start" { print $2 }' "$RUNNER_TEMP/e2e-times")
          setup=$(awk '$1 == "setup" { print $2 }' "$RUNNER_TEMP/e2e-times")
          setup=${setup:-$now}
          line="E2E shard ${{ matrix.shard }}: setup $((setup - start)) s, tests $((now - setup)) s, total $((now - start)) s of 1500 s; .deb cache hit: ${{ steps.apt-cache.outputs.cache-hit || 'false' }}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports-${{ matrix.shard }}
          path: |
            reports/perf.json
            reports/playwright
            test-results
