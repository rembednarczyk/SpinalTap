name: CI
# A pull request's run carries the base it was tested on, so the push to main after a merge can
# tell whether that exact code already passed (see the "changes" job).
# A workflow_dispatch run (map-refresh.yml starts one on its branch: a PR opened with GITHUB_TOKEN
# starts no workflow) is named after its branch.
run-name: ${{ github.event_name == 'pull_request' && format('{0} (#{1}) on base {2}', github.event.pull_request.title, github.event.pull_request.number, github.event.pull_request.base.sha) || github.event_name == 'workflow_dispatch' && format('Dispatch on {0}', github.ref_name) || github.event.head_commit.message }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # By hand or from map-refresh.yml: "What changed" has no base to compare with (no PR, no
  # `before`), so it runs everything; the skip of code already tested is for pushes only.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Minutes (user decision 1.11, no loss of coverage): draft pull requests run nothing (mark the
  # PR ready for CI); a change of docs alone (docs/**, changelog.d/**, *.md) runs nothing either,
  # on a pull request and on main; every job has a time limit, so a hung run cannot burn hours.
  changes:
    name: What changed
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tables: ${{ steps.diff.outputs.tables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A push to main from a merge whose pull request passed CI on this same base (the main
      # before the push) holds exactly the code that run tested: a squash merge of the PR's head
      # onto that base. It runs nothing again (saves a full run per merge). A merge onto a main
      # that moved since the PR's run (another PR in between) runs everything, as before.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' || true)
          if [ -z "$head" ] || [ -z "$BEFORE" ]; then echo "same=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=50" \
            --jq "[.workflow_runs[] | select(.display_title | endswith(\"on base $BEFORE\"))] | length" || echo 0)
          echo "PR head $head, base $BEFORE: $runs green run(s) on this base"
          if [ "${runs:-0}" -gt 0 ]; then echo "same=true" >> "$GITHUB_OUTPUT"; else echo "same=false" >> "$GITHUB_OUTPUT"; fi
      - id: diff
        run: |
          if [ "${{ steps.tested.outputs.same }}" = "true" ]; then
            echo "The merged code passed CI in its pull request on this base: nothing runs again."
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git -c core.quotePath=false diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            files=$(git -c core.quotePath=false diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "tables=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|changelog\.d/)|\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          # The map tables' generators, their data or the tables (ADR-0083): job "Map tables".
          if echo "$files" | grep -qE '^(tools/osm-import/|tools/orto/|data/|packages/sim/src/content/lublin/)'; then echo "tables=true" >> "$GITHUB_OUTPUT"; else echo "tables=false" >> "$GITHUB_OUTPUT"; fi

  # ADR-0083 step 1: the unit test compares only the fingerprint of the tables' inputs in their
  # headers (milliseconds); this job generates the tables again once and compares them byte for
  # byte, and checks that the fingerprints cover every file the generators read. Only when the
  # generators, their data or the tables change: a change elsewhere that the generators import
  # changes the fingerprint, the unit test asks for the tables again, and the new tables run this.
  tables:
    name: Map tables
    needs: changes
    # Every change of code too: the header's fingerprint covers only what the map owns (fingerprint.ts,
    # OWNED), so a change of the simulation or the renderer that shapes the tables shows up only here.
    if: needs.changes.outputs.tables == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the tables (pnpm osm:build && pnpm osm:props), recording the files they read
        run: |
          READ_TRACE="$RUNNER_TEMP/build.txt" node --import ./tools/osm-import/src/read-trace.ts tools/osm-import/src/build.ts > "$RUNNER_TEMP/build.log"
          READ_TRACE="$RUNNER_TEMP/props.txt" node --import ./tools/osm-import/src/read-trace.ts tools/osm-import/src/props.ts > "$RUNNER_TEMP/props.log"
      - name: Compare with the committed tables
        run: |
          if ! git diff --quiet -- packages/sim/src/content/lublin; then
            git diff --stat -- packages/sim/src/content/lublin
            git diff -- packages/sim/src/content/lublin | cut -c1-200 | head -80
            echo "::error title=Map tables out of date::The committed tables differ from what pnpm osm:build && pnpm osm:props write from the inputs: run both and commit packages/sim/src/content/lublin/*.generated.ts (ADR-0083)."
            exit 1
          fi
      - name: Check that the fingerprints cover every file the generators read
        run: |
          node tools/osm-import/src/tables-check.ts --trace "build=$RUNNER_TEMP/build.txt" --trace "props=$RUNNER_TEMP/props.txt" || {
            echo "::error title=Map tables' inputs::A file the generators read is no input of the tables' fingerprint: add it to TABLES in tools/osm-import/src/fingerprint.ts (ADR-0083; the log above lists it)."
            exit 1
          }

  # G-376: one job ran the whole suite with coverage in 18.6 min against its 20 min limit. Two
  # shards run in parallel and write blob reports; the checks job merges them and applies the
  # coverage thresholds once, on the merged coverage (a shard alone covers only part of the code).
  unit:
    # No matrix value in the name, as with the e2e shards.
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The default reporter prints failures in the log; the blob report feeds the merge; the
      # test-time reporter writes the time of every file for the time gate (job test-time); the
      # github-actions reporter puts each failure (test, message, file:line) as a short annotation
      # on the check run, so a red run is read without downloading the whole log.
      - run: pnpm exec vitest run --coverage --reporter=default --reporter=blob --reporter=github-actions --reporter=./tools/test-time/src/reporter.ts --shard=${{ matrix.shard }}/2
        env:
          VITEST_COVERAGE_SHARD: "1"
          TEST_TIME_OUTPUT: reports/unit-times/unit-times-${{ matrix.shard }}.json
      # Only a passing shard: a red run is no reference. On main the times are the reference for
      # the pull requests that follow, so they stay longer than the copy of a pull request.
      - uses: actions/upload-artifact@v4
        with:
          name: unit-times-${{ matrix.shard }}
          path: reports/unit-times
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  checks:
    name: Typecheck, lint, architecture, unit tests
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm depcheck
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: pnpm exec vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: reports/coverage

  # Time gate of the unit tests (ADR-0046, ADR-0083 step 2): a test over half of its time limit,
  # or more than 30% (and 1 s) slower than the median of the last green runs of main, fails the
  # pull request that slows it (exceptions only by tools/test-time/src/exceptions.ts, with their
  # reasons); a test file more than 50% and 2 s slower than the last run of main gets a warning.
  # Its own small job after the shards, beside the checks, so it adds nothing to the critical path:
  # no pnpm install, Node runs the tool's TypeScript directly.
  test-time:
    name: Unit test time
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/test-time
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-times-*
          path: ${{ runner.temp }}/times/head
          merge-multiple: true
      # The newest green push runs of main that have the times (a docs-only run has none), up to
      # five (REFERENCE_RUNS in tools/test-time/src/gate.ts), each in its own directory, newest
      # first: the gate takes the median over them. Reading artifacts of other runs needs only the
      # run's own token with actions: read.
      - name: Download the times of the last green runs of main
        id: main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/times/main"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 30 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha[0:7])"' > "$RUNNER_TEMP/main-runs"
          n=0
          while read -r id sha; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'unit-times-*' --dir "$RUNNER_TEMP/times/main/$((n + 1))" < /dev/null; then
              n=$((n + 1))
              [ "$n" = 1 ] && echo "reference=main $sha, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >> "$GITHUB_OUTPUT"
              [ "$n" = 5 ] && break
            else
              rm -rf "$RUNNER_TEMP/times/main/$((n + 1))"
            fi
          done < "$RUNNER_TEMP/main-runs"
          echo "$n green run(s) of main with unit test times among the last 30."
      - name: Compare with main
        env:
          REFERENCE: ${{ steps.main.outputs.reference }}
        run: node tools/test-time/src/compare.ts "$RUNNER_TEMP/times/head" "$RUNNER_TEMP/times/main" "$REFERENCE"

  # ADR-0046: shards in parallel with the checks; each builds once and runs a group of specs
  # (a single job took 40 min, most of it cold boots under SwiftShader). Setup is about 2 min a
  # shard with warm caches (G-387). Three since 15.11: two groups reached 24.7 and 14.7 min of
  # the 25 min limit (playwright.config.ts).
  e2e:
    # No matrix value in the name: GitHub appends "(1)", "(2)" itself, and a skipped job (docs-only
    # change) then reads plainly instead of showing the unexpanded expression.
    name: E2E (build, smoke, NPR snapshot, perf budget)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start the clock
        run: echo "start $(date +%s)" > "$RUNNER_TEMP/e2e-times"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      # G-387: browsers and the system packages Playwright wants come from caches. The fonts
      # (fonts-ipafont-gothic, fonts-unifont, xfonts-*, 22 MB) once took 11 min from a slow apt
      # mirror and the shard ran out of time. They stay installed: signs and props draw text into
      # the canvas, so the NPR snapshot may depend on the fallback fonts.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install chromium
      - name: Install system dependencies of Chromium (cached .deb packages first)
        id: deps
        run: |
          # The dry run lists what apt would install (dependencies included) and exits 1 if any.
          missing() { pnpm exec playwright install-deps --dry-run chromium | sed -n 's/^  \([^ ]*\)$/\1/p' || true; }
          need=$(missing)
          if [ -z "$need" ]; then echo "All system dependencies of Chromium are installed."; exit 0; fi
          echo "Missing:" $need
          if ls ~/playwright-debs/*.deb >/dev/null 2>&1; then
            # Local .deb files whose dependencies are present: dpkg only, no apt resolution and no mirror.
            # apt-get install with file paths still fetched the same fonts from the mirror when the
            # mirror offered another candidate (amd64v3), which cost 15 min at 31 kB/s (G-400).
            ls -l ~/playwright-debs
            sudo dpkg -i ~/playwright-debs/*.deb || true
            need=$(missing)
          fi
          if [ -n "$need" ]; then
            echo "Downloading:" $need
            sudo apt-get update
            mkdir -p ~/playwright-debs
            (cd ~/playwright-debs && apt-get download $need)
            sudo dpkg -i ~/playwright-debs/*.deb
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          test -z "$(missing)"
      - if: steps.deps.outputs.save == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Mark the end of setup
        run: echo "setup $(date +%s)" >> "$RUNNER_TEMP/e2e-times"
      # Three groups of about equal time (playwright.config.ts, E2E_GROUP), not --shard: that splits
      # by test count and left every slow spec in shard 1.
      - run: pnpm test:e2e
        env:
          CI: "true"
          E2E_GROUP: ${{ matrix.shard }}
      - name: Print setup and test times
        if: always()
        run: |
          now=$(date +%s)
          start=$(awk '$1 == "start" { print $2 }' "$RUNNER_TEMP/e2e-times")
          setup=$(awk '$1 == "setup" { print $2 }' "$RUNNER_TEMP/e2e-times")
          setup=${setup:-$now}
          line="E2E shard ${{ matrix.shard }}: setup $((setup - start)) s, tests $((now - setup)) s, total $((now - start)) s of 1500 s; .deb cache hit: ${{ steps.apt-cache.outputs.cache-hit || 'false' }}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports-${{ matrix.shard }}
          path: |
            reports/perf.json
            reports/playwright
            test-results
